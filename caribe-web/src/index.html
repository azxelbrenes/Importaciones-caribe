  <!-- preconnect antes de las fuentes: abre la conexión mientras

       100 ms en la primera carga. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <!-- Medidor de Cloudflare: cuanta gente entra y que paginas mira.
       No usa cookies ni identifica personas, asi que no hace falta el
       aviso de cookies.

       REEMPLAZAR el token por el que da Cloudflare en
       Analytics & Logs > Web Analytics. Es publico: va en el HTML de
       todas formas. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "PEGAR_TOKEN_DE_CLOUDFLARE"}'></script>
</body>
</html>
