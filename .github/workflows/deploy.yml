name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRO: ghcr.io

jobs:
  construir:
    name: Construir imágenes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # Las dos imágenes se construyen en paralelo. Secuencial
    # tardaría el doble sin ninguna ventaja: no dependen entre sí.
    strategy:
      matrix:
        incluir:
          - nombre: api
            archivo: Dockerfile.api
          - nombre: web
            archivo: Dockerfile.web

    steps:
      - uses: actions/checkout@v4

      # El nombre del repositorio tiene mayúscula y los registros
      # de imágenes solo aceptan minúsculas.
      - name: Preparar nombre
        id: nombre
        run: echo "imagen=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Entrar al registro
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.incluir.archivo }}
          push: true
          tags: |
            ${{ env.REGISTRO }}/${{ steps.nombre.outputs.imagen }}-${{ matrix.incluir.nombre }}:latest
            ${{ env.REGISTRO }}/${{ steps.nombre.outputs.imagen }}-${{ matrix.incluir.nombre }}:${{ github.sha }}
          # Cache separado por imagen: si compartieran clave, cada
          # una invalidaría la de la otra.
          cache-from: type=gha,scope=${{ matrix.incluir.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.incluir.nombre }}

  desplegar:
    name: Desplegar al servidor
    needs: construir
    runs-on: ubuntu-latest

    steps:
      - name: Conectar y actualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/caribe

            echo "── Descargando imágenes nuevas ──"
            docker compose pull

            echo "── Levantando ──"
            docker compose up -d

            echo "── Limpiando imágenes viejas ──"
            # Sin esto, cada despliegue deja las anteriores y el
            # disco de 55 GB se llena en unas semanas.
            docker image prune -f --filter "until=168h"

  verificar:
    name: Verificar
    needs: desplegar
    runs-on: ubuntu-latest

    steps:
      - name: Comprobar el API
        run: |
          echo "Esperando al API…"

          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 https://${{ secrets.DOMINIO }}/health > /dev/null; then
              echo "✓ El API responde."
              exit 0
            fi
            echo "  intento $i de 12…"
            sleep 5
          done

          echo "✗ El API no respondió."
          exit 1

      - name: Comprobar el sitio
        run: |
          echo "Esperando al frontend…"

          # Angular con SSR tarda más en arrancar que el API: tiene
          # que levantar Node y renderizar la primera página.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://${{ secrets.DOMINIO }}/ > /dev/null; then
              echo "✓ El sitio responde."
              exit 0
            fi
            echo "  intento $i de 12…"
            sleep 5
          done

          echo "✗ El sitio no respondió."
          echo "  Revisar: docker compose logs web --tail=50"
          exit 1
